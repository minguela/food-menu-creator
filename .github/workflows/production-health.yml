name: Production Health Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  production-health-check:
    name: Production health-check
    runs-on: ubuntu-latest
    env:
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://food-menu-creator-lyart.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production health-check
        run: npm run health-check -- --base-url="${PROD_BASE_URL}"

  notify-production-failure:
    name: Notify production health failure
    runs-on: ubuntu-latest
    needs: [production-health-check]
    if: ${{ always() && needs.production-health-check.result == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - name: Telegram notification (optional)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          MSG="🚨 Production health-check failed%0ARepo: ${GITHUB_REPOSITORY}%0ABranch: ${GITHUB_REF_NAME}%0ARun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MSG}"
      - name: WhatsApp notification
        uses: ./.github/actions/notify-whatsapp
        with:
          apikey: ${{ secrets.CALLMEBOT_API_KEY }}
          message: "Production health-check FAILED — ${GITHUB_REPOSITORY}\nBranch: ${GITHUB_REF_NAME}\nRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          status: failure

  notify-production-success:
    name: Notify production health success
    runs-on: ubuntu-latest
    needs: [production-health-check]
    if: ${{ always() && needs.production-health-check.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: WhatsApp notification
        uses: ./.github/actions/notify-whatsapp
        with:
          apikey: ${{ secrets.CALLMEBOT_API_KEY }}
          message: "Production health-check OK — ${GITHUB_REPOSITORY}\nBranch: ${GITHUB_REF_NAME}"
          status: success
