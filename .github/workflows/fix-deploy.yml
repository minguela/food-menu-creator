name: Fix Deploy Failures

on:
  repository_dispatch:
    types: [deploy-fix]

  workflow_dispatch:
    inputs:
      error_logs:
        description: 'Error output from lint/build (paste from Vercel or CLI)'
        required: false
        type: string
      branch:
        description: 'Target branch to fix'
        required: false
        type: string
        default: main

env:
  NODE_VERSION: '20'
  WORKING_DIR: ./menu-web
  OPENCODE_VERSION: '0.12.0'

permissions:
  contents: read

jobs:
  fix-deploy:
    name: Fix Deploy Errors
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run lint (nuxt typecheck)
        id: lint
        run: npm run lint
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Run dark class audit
        id: lint-dark
        run: npm run lint:dark
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Run confirm audit
        id: lint-confirm
        run: npm run lint:confirm
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Run build
        id: build
        run: npm run build
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Check results
        id: check-results
        run: |
          LINT_EXIT=${{ steps.lint.outcome }}
          BUILD_EXIT=${{ steps.build.outcome }}
          DARK_EXIT=${{ steps.lint-dark.outcome }}
          CONFIRM_EXIT=${{ steps.lint-confirm.outcome }}

          echo "LINT_EXIT=$LINT_EXIT" >> $GITHUB_ENV
          echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_ENV
          echo "DARK_EXIT=$DARK_EXIT" >> $GITHUB_ENV
          echo "CONFIRM_EXIT=$CONFIRM_EXIT" >> $GITHUB_ENV

          if [ "$LINT_EXIT" == "success" ] && [ "$BUILD_EXIT" == "success" ] && [ "$DARK_EXIT" == "success" ] && [ "$CONFIRM_EXIT" == "success" ]; then
            echo "STATUS=success" >> $GITHUB_ENV
            echo "summary=All checks passed. No fixes needed." >> $GITHUB_ENV
            echo "Lint, dark-audit, confirm-audit and build passed - no action needed."
          else
            echo "STATUS=failed" >> $GITHUB_ENV
            SUMMARY="Lint: $LINT_EXIT, Dark: $DARK_EXIT, Confirm: $CONFIRM_EXIT, Build: $BUILD_EXIT"
            echo "summary=$SUMMARY" >> $GITHUB_ENV
            echo "Build/lint/dark-audit/confirm-audit failed - will attempt fix."
          fi

      - name: Prepare fix branch
        if: env.STATUS == 'failed'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="fix/deploy-${TIMESTAMP}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Run opencode to fix errors
        if: env.STATUS == 'failed'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          ERROR_LOGS="${{ inputs.error_logs || github.event.client_payload.error_summary || 'Build failed - see logs above' }}"
          echo "=== Error logs received ==="
          echo "$ERROR_LOGS"
          echo "============================"

          npx -y "opencode@${OPENCODE_VERSION}" fix-errors "$ERROR_LOGS" \
            --skill nuxt-best-practices \
            --output commit \
            --working-dir ${{ env.WORKING_DIR }}

      - name: Commit and push changes
        if: env.STATUS == 'failed'
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit from opencode"
          else
            git commit -m "fix: auto-fix deploy failures"
            git push -u origin ${{ env.BRANCH_NAME }}
            echo "CHANGES_COMMITTED=true" >> $GITHUB_ENV
          fi

      - name: Create PR
        if: env.STATUS == 'failed' && env.CHANGES_COMMITTED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const payload = ${{ toJSON(github.event.client_payload) }};
            const deploymentUrl = payload?.url || '${{ inputs.error_logs }}';

            const result = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'fix: auto-fix deploy failures',
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: `## Auto-generated Fix\n\nAutomated fix for deployment failure.\n\n**Status**: Lint: ${{ env.LINT_EXIT }}, Build: ${{ env.BUILD_EXIT }}\n\n**Deployment**: ${deploymentUrl}\n\nPlease review before merging.`
            });

            console.log(`PR created: ${result.data.html_url}`);
            core.exportVariable('PR_URL', result.data.html_url);
            core.exportVariable('PR_NUMBER', result.data.number);

      - name: Notify Telegram - Fix ready
        if: env.STATUS == 'failed' && env.CHANGES_COMMITTED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERROR_SUMMARY=$(echo '${{ env.summary }}' | head -c 400)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ *Fix PR created!*%0A%0APreview: ${{ env.PR_URL }}%0A%0A*Errors:* ${ERROR_SUMMARY}" \
            -d "parse_mode=Markdown"

      - name: WhatsApp - Fix PR created
        if: env.STATUS == 'failed' && env.CHANGES_COMMITTED == 'true'
        uses: ./.github/actions/notify-whatsapp
        with:
          apikey: ${{ secrets.CALLMEBOT_API_KEY }}
          message: "Fix PR created! — ${GITHUB_REPOSITORY}\nPR: ${{ env.PR_URL }}\nErrors: ${{ env.summary }}"
          status: success

      - name: Notify Telegram - Cannot fix
        if: env.STATUS == 'failed' && env.CHANGES_COMMITTED != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERROR_SUMMARY=$(echo '${{ env.summary }}' | head -c 400)
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ *Deploy failed, couldn't auto-fix.*%0A%0A*Errors:* ${ERROR_SUMMARY}%0A%0ACheck logs: ${WORKFLOW_URL}" \
            -d "parse_mode=Markdown"

      - name: WhatsApp - Cannot fix (blocking)
        if: env.STATUS == 'failed' && env.CHANGES_COMMITTED != 'true'
        uses: ./.github/actions/notify-whatsapp
        with:
          apikey: ${{ secrets.CALLMEBOT_API_KEY }}
          message: "BLOCKED — Deploy failed, couldn't auto-fix — ${GITHUB_REPOSITORY}\nErrors: ${{ env.summary }}\nLogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status: failure

      - name: WhatsApp - All checks passed
        if: env.STATUS == 'success'
        uses: ./.github/actions/notify-whatsapp
        with:
          apikey: ${{ secrets.CALLMEBOT_API_KEY }}
          message: "Fix-deploy checks passed — ${GITHUB_REPOSITORY}\nBranch: ${GITHUB_REF_NAME}\nNo action needed."
          status: success

      - name: Summary output
        run: |
          echo "=== Workflow Summary ==="
          echo "Status: ${{ env.STATUS }}"
          echo "Lint: ${{ env.LINT_EXIT }}"
          echo "Build: ${{ env.BUILD_EXIT }}"
          echo "Branch: ${{ env.BRANCH_NAME || 'N/A' }}"
          echo "PR: ${{ env.PR_URL || 'N/A' }}"
          echo "========================="
